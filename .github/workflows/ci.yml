name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check
      - name: ruff format --check
        run: ruff format --check
      - name: pytest (sin red)
        run: pytest --cov=sanger --cov-report=term
      - name: Cobertura ≥ 80 % en la parte científica (qc, ensamblado, clasificación)
        run: coverage report --fail-under=80 --include="src/sanger/qc/*,src/sanger/ensamblado/*,src/sanger/clasificacion.py"
