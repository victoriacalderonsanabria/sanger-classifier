[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sanger-classifier"
version = "0.1.0"
description = "Control de calidad, consenso F/R y BLAST de cromatogramas Sanger (.ab1) para identificar especies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Victoria Calderón" }]
requires-python = ">=3.11"
dependencies = ["biopython>=1.85"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-socket>=0.7",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "scripts"]
# --disable-socket: cualquier test que intente usar la red falla. La suite
# tiene que correr offline; un test que necesita internet está mal escrito.
addopts = "-ra --disable-socket"

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "src", "scripts", "tests"]
# legacy/ está congelado para siempre. sanger_gui.py es la ventana original sin
# tocar: se excluye hasta que la fase 3 la reemplace.
extend-exclude = ["legacy", "sanger_gui.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Los textos de --help están copiados literal del script original: cortarlos
# para respetar el largo de línea cambiaría lo que ve el usuario.
"src/sanger/cli.py" = ["E501"]

[tool.coverage.run]
omit = ["legacy/*"]
