[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sanger-classifier"
version = "1.0.0"
description = "Control de calidad, consenso F/R y BLAST de cromatogramas Sanger (.ab1) para identificar especies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Victoria Calderón" }]
requires-python = ">=3.11"
dependencies = ["biopython>=1.85"]

[project.optional-dependencies]
# La ventana. Aparte porque la línea de comandos no la necesita, y porque
# PySide6 pesa unos 100 MB: el CI no la instala (los tests de la ventana se
# saltean solos si no está).
ui = ["PySide6>=6.7"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-socket>=0.7",
    "ruff>=0.6",
]

[project.gui-scripts]
clasificador-sanger = "sanger_ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sanger_ui = ["recursos/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "scripts"]
# --disable-socket: cualquier test que intente usar la red falla. La suite
# tiene que correr offline; un test que necesita internet está mal escrito.
addopts = "-ra --disable-socket"

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "src", "scripts", "tests"]
# legacy/ está congelado para siempre.
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Los textos de --help están copiados literal del script original: cortarlos
# para respetar el largo de línea cambiaría lo que ve el usuario.
"src/sanger/cli.py" = ["E501"]

[tool.coverage.run]
omit = ["legacy/*"]
