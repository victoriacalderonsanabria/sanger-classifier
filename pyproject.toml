[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sanger-classifier"
version = "0.0.1"
description = "Control de calidad, consenso F/R y BLAST de cromatogramas Sanger (.ab1) para identificar especies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Victoria Calderón" }]
requires-python = ">=3.11"
dependencies = ["biopython>=1.85"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-socket>=0.7",
    "ruff>=0.6",
]

[tool.setuptools]
# Fase 0: todavía no hay paquete; el código son los scripts originales de la
# raíz, copiados sin cambios. En la fase 1 esto pasa a src/sanger y src/sanger_ui.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
# --disable-socket: cualquier test que intente usar la red falla. La suite
# tiene que correr offline; un test que necesita internet está mal escrito.
addopts = "-ra --disable-socket"

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "scripts"]
# legacy/ está congelado para siempre. Los dos scripts de la raíz se excluyen
# solo durante la fase 0 (no se pueden tocar); en la fase 1 salen de esta lista.
extend-exclude = ["legacy", "clasificar_sanger.py", "sanger_gui.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.coverage.run]
omit = ["legacy/*"]
